name: Update forecast

# Runs every 3 hours (times are UTC, so 00:15 UTC = 02:15 in Kleinmond),
# and can also be started by hand from the Actions tab ("Run workflow").
on:
  schedule:
    - cron: "15 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: forecast
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch forecast for all launch spots
        env:
          STORMGLASS_KEY: ${{ secrets.STORMGLASS_KEY }}
        run: python scripts/fetch_forecast.py

      - name: Save the new data
        run: |
          git config user.name "forecast-bot"
          git config user.email "forecast-bot@users.noreply.github.com"
          git add data/forecast.json
          git diff --cached --quiet || git commit -m "Forecast update $(date -u +'%Y-%m-%d %H:%M') UTC"
          git push
